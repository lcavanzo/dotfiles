# NUMBERED SESSIONS
# Name sessions with a number prefix ("01-SLB", "02-marketplace", "03-traffic-manager")
# and jump by number. Nothing is hardcoded: rename or renumber a session and the keys follow.
# Scripts live in ~/.config/tmux/scripts/.

# prefix + 1..9  -> session 01..09
bind 1 run-shell "~/.config/tmux/scripts/session-jump.sh 1"
bind 2 run-shell "~/.config/tmux/scripts/session-jump.sh 2"
bind 3 run-shell "~/.config/tmux/scripts/session-jump.sh 3"
bind 4 run-shell "~/.config/tmux/scripts/session-jump.sh 4"
bind 5 run-shell "~/.config/tmux/scripts/session-jump.sh 5"
bind 6 run-shell "~/.config/tmux/scripts/session-jump.sh 6"
bind 7 run-shell "~/.config/tmux/scripts/session-jump.sh 7"
bind 8 run-shell "~/.config/tmux/scripts/session-jump.sh 8"
bind 9 run-shell "~/.config/tmux/scripts/session-jump.sh 9"

# prefix + 0  -> type any number (10, 11, 25...)
bind 0 command-prompt -p "go to session #:" "run-shell '~/.config/tmux/scripts/session-jump.sh %%'"

# prefix + S  -> new session, auto-numbered (blank dir = ~)
bind S command-prompt -p "session name:,start dir:" "run-shell '~/.config/tmux/scripts/session-new.sh \"%1\" \"%2\"'"

# prefix + N  -> give the current session a number (keeps its name)
bind N command-prompt -p "number for #S:" "run-shell '~/.config/tmux/scripts/session-number.sh %%'"

# Alt+1..9  -> same jump with no prefix (works because Ghostty has macos-option-as-alt = left)
bind -n M-1 run-shell "~/.config/tmux/scripts/session-jump.sh 1"
bind -n M-2 run-shell "~/.config/tmux/scripts/session-jump.sh 2"
bind -n M-3 run-shell "~/.config/tmux/scripts/session-jump.sh 3"
bind -n M-4 run-shell "~/.config/tmux/scripts/session-jump.sh 4"
bind -n M-5 run-shell "~/.config/tmux/scripts/session-jump.sh 5"
bind -n M-6 run-shell "~/.config/tmux/scripts/session-jump.sh 6"
bind -n M-7 run-shell "~/.config/tmux/scripts/session-jump.sh 7"
bind -n M-8 run-shell "~/.config/tmux/scripts/session-jump.sh 8"
bind -n M-9 run-shell "~/.config/tmux/scripts/session-jump.sh 9"
